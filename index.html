<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Stats is now Stazzo</title>
  <script>
    // Team Stats is now Stazzo, at its own address. Keep the page, invite (?t=…) and #route so old links still work.
    var NEW_SITE = "https://stazzo.app/";
    var path = location.pathname.replace(/^\/team-stats\/?/, "");
    location.replace(NEW_SITE + path + location.search + location.hash);
  </script>
  <style>
    body { font: 17px/1.5 -apple-system, system-ui, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 16px; }
  </style>
</head>
<body>
  <h1>Team Stats is now Stazzo</h1>
  <p>Opening the new address… If nothing happens, <a id="go" href="#">tap here</a>.</p>
  <p>Saved Team Stats to your home screen? Open the new address in Safari, tap Share → Add to Home Screen, and delete
    the old icon. You'll sign in once more there.</p>
  <script>document.getElementById("go").href = NEW_SITE;</script>
</body>
</html>
