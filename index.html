<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121411">
  <meta name="robots" content="noindex">
  <title>Team Stats</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Team Stats">
  <script>
    // Hosts like GitHub Pages let browsers keep old copies for up to 10 minutes, so load the latest
    // styles, config and code every time (otherwise an update wouldn't show right away).
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "styles.css?v=" + Date.now();
    document.head.appendChild(css);
  </script>
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
    (function load(files) {
      if (!files.length) return;
      var s = document.createElement("script");
      s.src = files[0] + "?v=" + Date.now();
      s.onload = function () { load(files.slice(1)); };
      document.body.appendChild(s);
    })(["config.js", "engine.js", "book.js", "scorer.js", "app.js"]);
  </script>
</body>
</html>
