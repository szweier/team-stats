<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121411">
  <meta name="robots" content="noindex">
  <title>Team Stats</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <script>
    // Always load the latest config and code: hosts like GitHub Pages let browsers keep old copies
    // for up to 10 minutes, so an update (or a just-filled-in config.js) wouldn't show right away.
    (function load(files) {
      if (!files.length) return;
      var s = document.createElement("script");
      s.src = files[0] + "?v=" + Date.now();
      s.onload = function () { load(files.slice(1)); };
      document.body.appendChild(s);
    })(["config.js", "app.js"]);
  </script>
</body>
</html>
